info:
  name: 8.1 Get My Subscription
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/{{API_PREFIX}}/subscriptions/me"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const res = res.getBody();
        if (res.data) {
          bru.setCollectionVar('accessToken', res.data.accessToken);
          bru.setCollectionVar('refreshToken', res.data.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
