info:
  name: 2.1 Login (owner)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{slug}}",
        "phone": "+8801700000000",
        "password": "SuperSecret123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const res = res.getBody();
        if (res.data) {
          pm.collectionVariables.set('accessToken', res.data.accessToken);
          pm.collectionVariables.set('refreshToken', res.data.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
