info:
  name: 1.2 Verify registration OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/organizations/verify-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{slug}}",
        "code": "{{devCode}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const res = res.getBody();
        if (res.data) {
          pm.collectionVariables.set('accessToken', res.data.accessToken);
          pm.collectionVariables.set('refreshToken', res.data.refreshToken);
          pm.collectionVariables.set('tenantId', res.data.tenantId);
          pm.collectionVariables.set('ownerUserId', res.data.ownerUserId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
