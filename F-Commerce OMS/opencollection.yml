opencollection: 1.0.0

info:
  name: Multi-Tenant F-Commerce OMS API

request:
  variables:
    - name: baseUrl
      value: http://localhost:3000/api/v1
    - name: slug
      value: xianmart
    - name: devCode
      value: ""
    - name: accessToken
      value: ""
    - name: refreshToken
      value: ""
    - name: tenantId
      value: ""
    - name: ownerUserId
      value: ""
    - name: deliveryRoleId
      value: ""
    - name: staffUserId
      value: ""
    - name: staffAccessToken
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
