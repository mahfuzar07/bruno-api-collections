info:
  name: 1.3 Resend OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/organizations/resend-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{slug}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
