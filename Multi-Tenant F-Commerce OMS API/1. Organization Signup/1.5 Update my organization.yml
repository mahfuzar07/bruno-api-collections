info:
  name: 1.5 Update my organization
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/organizations/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Xianmart Ltd"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
