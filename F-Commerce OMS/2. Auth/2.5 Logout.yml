info:
  name: 2.5 Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
