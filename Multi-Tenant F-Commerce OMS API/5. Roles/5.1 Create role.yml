info:
  name: 5.1 Create role
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/roles"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "DELIVERY",
        "description": "Delivery staff",
        "permissionNames": []
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const res = res.getBody();
        if (res.data && res.data.id) { bru.setCollectionVar('deliveryRoleId', res.data.id); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
