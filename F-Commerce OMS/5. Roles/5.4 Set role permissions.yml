info:
  name: 5.4 Set role permissions
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/roles/{{deliveryRoleId}}/permissions"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "permissionNames": ["orders.view", "orders.create"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
