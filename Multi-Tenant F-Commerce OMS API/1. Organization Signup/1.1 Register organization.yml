info:
  name: 1.1 Register organization
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/{{API_PREFIX}}/organizations/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "orgName": "Xianmart",
        "slug": "xianmart",
        "ownerName": "Md. Mahfuzar Rahman",
        "ownerPhone": "+8801700000000",
        "ownerEmail": "mahfuzar@gmail.com",
        "ownerPassword": "super123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const res = res.getBody();
        if (res.data && res.data.devCode) { bru.setCollectionVar('devCode', res.data.devCode); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
