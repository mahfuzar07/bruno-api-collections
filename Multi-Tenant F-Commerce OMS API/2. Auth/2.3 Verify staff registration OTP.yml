info:
  name: 2.3 Verify staff registration OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{slug}}",
        "phone": "+8801800000000",
        "purpose": "REGISTER",
        "code": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
