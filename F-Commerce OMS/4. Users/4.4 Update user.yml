info:
  name: 4.4 Update user
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/users/{{staffUserId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Updated Name"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
